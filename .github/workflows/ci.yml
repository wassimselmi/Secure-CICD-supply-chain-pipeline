name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs on the same branch when a newer commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared across all jobs; keeps pip quiet and reproducible
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# ─────────────────────────────────────────────────────────────────────────────
# Matrix: test against Python 3.11 and 3.12
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. LINT ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Cache pip's download cache keyed on requirements files + OS + Python version
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            pip-lint-${{ runner.os }}-py${{ matrix.python-version }}-
            pip-lint-${{ runner.os }}-

      - name: Install lint dependencies
        run: pip install -r requirements-lint.txt

      - name: Run flake8
        run: flake8 app.py test_app.py


  # ── 2. TEST ────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint          # Only run tests when linting passes

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Separate cache key per job so lint and test caches don't collide
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-test-${{ runner.os }}-py${{ matrix.python-version }}-
            pip-test-${{ runner.os }}-

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest test_app -v

      - name: Upload test results (optional artefact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-py${{ matrix.python-version }}
          path: "*.log"
          retention-days: 7


  # ── 3. BUILD ───────────────────────────────────────────────────────────────
  build:
    name: Docker build (slim multi-stage)
    runs-on: ubuntu-latest
    needs: test          # Only build when all tests pass

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Cache Docker layers using GitHub Actions cache backend
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ runner.os }}-

      - name: Build slim image (multi-stage, non-root)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false          # Set to true + add registry credentials to publish
          tags: secure-api:slim
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to:   type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Prevents ever-growing cache by replacing old with new
      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Verify non-root user inside image
        run: |
          docker run --rm \
            $(docker images secure-api:slim -q | head -1) \
            id | grep "uid=1001(appuser)"

      - name: Print final image size
        run: docker images secure-api:slim --format "Image: {{.Repository}}:{{.Tag}}  Size: {{.Size}}"
