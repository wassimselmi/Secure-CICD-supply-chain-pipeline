name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs on the same branch when a newer commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared across all jobs; keeps pip quiet and reproducible
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# ─────────────────────────────────────────────────────────────────────────────
# Matrix: test against Python 3.11 and 3.12
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. LINT ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Cache pip's download cache keyed on requirements files + OS + Python version
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            pip-lint-${{ runner.os }}-py${{ matrix.python-version }}-
            pip-lint-${{ runner.os }}-

      - name: Install lint dependencies
        run: pip install -r requirements-lint.txt

      - name: Run flake8
        run: flake8 app.py test_app.py


  # ── 2. SAST – Semgrep ─────────────────────────────────────────────────────
  sast:
    name: SAST – Semgrep
    runs-on: ubuntu-latest
    needs: lint          # Only scan when linting passes

    permissions:
      security-events: write  # Required to upload SARIF to the Security tab
      actions: read
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Install a pinned version of Semgrep so results are reproducible
      - name: Install Semgrep
        run: pip install semgrep==1.90.0

      # Run three rule-packs across ALL severity levels so every finding
      # appears in the GitHub Security tab (WARNING, INFO, ERROR alike).
      # No --error here — this step is purely for visibility.
      #   p/python        – Python-specific bugs & anti-patterns
      #   p/owasp-top-ten – Maps findings to OWASP Top 10 categories (WARNING+)
      #   p/secrets       – Detects hard-coded credentials / API keys (WARNING+)
      - name: Run Semgrep scan (all severities → SARIF)
        run: |
          semgrep scan \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            .
        # Don't fail here — we control failure in the enforcement step below

      # Upload SARIF regardless of what happens next so all findings are always
      # visible in GitHub Security → Code scanning alerts
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep   # Groups results under a named tool in the UI

      # Re-run scoped to ERROR severity only.
      # --severity ERROR → only match rules tagged severity: ERROR (high)
      # --error          → exit code 1 if any such finding exists → fails job
      # This is separate from the SARIF scan so WARNING/INFO findings are
      # still visible in the Security tab but do NOT break the build.
      - name: Enforce – fail on high-severity (ERROR) findings
        run: |
          semgrep scan \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/secrets \
            --severity ERROR \
            --error \
            .


  # ── 3. TEST ────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint          # Only run tests when linting passes

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Separate cache key per job so lint and test caches don't collide
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-test-${{ runner.os }}-py${{ matrix.python-version }}-
            pip-test-${{ runner.os }}-

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest test_app -v

      - name: Upload test results (optional artefact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-py${{ matrix.python-version }}
          path: "*.log"
          retention-days: 7


  # ── 4. SCA – Trivy filesystem / dependency scan ───────────────────────────
  trivy-fs:
    name: Trivy – dependency scan
    runs-on: ubuntu-latest
    needs: lint          # Runs in parallel with sast and test

    permissions:
      security-events: write  # Required to upload SARIF to the Security tab
      actions: read
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Scan the repo filesystem: pip packages, OS packages inside the tree,
      # and any lock-files Trivy recognises (requirements.txt, etc.).
      # --exit-code 1     → fail the job when CRITICAL or HIGH vulns are found
      # --ignore-unfixed  → skip vulns that have no fix yet (reduces noise)
      # --format sarif    → machine-readable output for the Security tab
      - name: Run Trivy (filesystem – dependencies)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif

      # Upload even if the scan step failed so findings are always visible
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs   # Shown as a separate tool group in the Security tab


  # ── 5. BUILD ───────────────────────────────────────────────────────────────
  build:
    name: Docker build (slim multi-stage)
    runs-on: ubuntu-latest
    needs: [test, sast, trivy-fs]  # Only build when tests, SAST and dep-scan pass

    permissions:
      security-events: write  # Required to upload SARIF to the Security tab
      actions: read
      contents: read
      packages: write          # Push & attest to GHCR
      id-token: write          # Required for GitHub OIDC → keyless Cosign signing

    outputs:
      # Export the image digest so the verify job can sign/verify by digest,
      # not by mutable tag. Digest is set in the 'Capture image digest' step.
      image-digest: ${{ steps.digest.outputs.digest }}
      image-repo:   ${{ steps.digest.outputs.repo }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Cache Docker layers using GitHub Actions cache backend
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ runner.os }}-

      # Compute image tags before building so build-push-action can push in one shot.
      # Rules:
      #   • Always tag with the full 40-char commit SHA  → immutable, traceable
      #   • Also tag with the branch name (main, develop) → human-friendly pointer
      #   • 'latest' is intentionally omitted to prevent accidental overwrites
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
          # Examples of tags produced:
          #   ghcr.io/org/repo:sha-a1b2c3d4...  ← immutable per-commit tag
          #   ghcr.io/org/repo:main              ← mutable branch pointer

      # Log in to GHCR using the auto-generated GITHUB_TOKEN (no secret setup needed).
      # The token is scoped to this repo and expires when the job ends.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally only — push:false avoids buildx trying to authenticate
      # to Docker Hub for the unqualified 'secure-api:slim' local alias.
      # GHCR push happens in a dedicated step AFTER all verification/scanning.
      - name: Build slim image (multi-stage, non-root)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false          # Local only at this point
          load: true           # Export into the local Docker daemon
          tags: secure-api:slim
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to:   type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Prevents ever-growing cache by replacing old with new
      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Verify non-root user inside image
        run: |
          docker run --rm \
            $(docker images secure-api:slim -q | head -1) \
            id | grep "uid=1001(appuser)"

      - name: Print final image size
        run: docker images secure-api:slim --format "Image {{.Repository}}:{{.Tag}}  Size {{.Size}}"

      # ── SBOM generation ────────────────────────────────────────────────────
      # Syft inspects every layer of the image and catalogues all packages
      # (OS + language-level). Two formats are produced:
      #   • CycloneDX JSON  – preferred by most SBOM tooling and Dependency-Track
      #   • SPDX JSON       – required by some compliance frameworks (NTIA, EO 14028)
      # The SBOM is generated BEFORE the Trivy enforcement step so it is always
      # uploaded as a build artifact even when CVEs cause the build to fail.
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        # Pinning to the action's major version keeps the install reproducible;
        # Syft itself is fetched at the version bundled with the action release.

      - name: Generate SBOM – CycloneDX JSON
        run: |
          syft secure-api:slim \
            --output cyclonedx-json=sbom.cyclonedx.json
        # cyclonedx-json is the richest machine-readable format for most tooling

      - name: Generate SBOM – SPDX JSON
        run: |
          syft secure-api:slim \
            --output spdx-json=sbom.spdx.json
        # spdx-json satisfies NTIA minimum-element requirements

      # Print a human-readable package table directly in the job log.
      # This gives instant visibility without downloading the JSON artifact.
      # Columns: name, version, type (deb / python / etc.), location in image.
      - name: Print SBOM summary (table)
        run: |
          echo "### SBOM package summary for secure-api:slim"
          syft secure-api:slim --output table

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          # Artifact name includes the short SHA so each run's SBOM is traceable
          name: sbom-${{ github.sha }}
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
          retention-days: 90   # Keep SBOMs for 90 days for audit / compliance

      # Scan the freshly-built image for OS-package and library CVEs.
      # Must run after the build step so the image exists in the local daemon.
      # Step 1: full scan → SARIF (all severities, no exit-code so it always
      #         completes and SARIF can be uploaded to the Security tab).
      # Step 2: enforcement scan → fail only on CRITICAL/HIGH with a fix available.
      # Splitting mirrors the Semgrep pattern above and ensures:
      #   • All findings are always visible in the Security tab.
      #   • Unfixed CVEs (no upstream patch yet) do NOT break the build.
      - name: Run Trivy (image – SARIF report, all severities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-api:slim
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'          # Never fails — this step is for visibility only
          vuln-type: os,library
          format: sarif
          output: trivy-image.sarif
          trivyignores: ''
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"   # Suppress the "newer version" notice

      # Upload image scan SARIF separately from the filesystem scan
      # (different category = separate group in the Security tab)
      - name: Upload image SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Step 2: enforcement — fail the build only when a CRITICAL or HIGH CVE
      # has a fix available. Unfixed CVEs are skipped to reduce noise.
      - name: Enforce – fail on fixable CRITICAL/HIGH image CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-api:slim
          severity: CRITICAL,HIGH
          exit-code: '1'          # Non-zero exit → fails the job
          ignore-unfixed: true    # Only count CVEs that have an upstream fix
          vuln-type: os,library
          format: table           # Human-readable output in the job log
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"   # Suppress the "newer version" notice

      # ── Push to GHCR ───────────────────────────────────────────────────────
      # Push ONLY after the image has cleared every gate (verify, SBOM, Trivy).
      # The GHCR tags were computed earlier by docker/metadata-action.
      - name: Tag and push to GitHub Container Registry
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Tagging secure-api:slim → $tag"
            docker tag secure-api:slim "$tag"
            docker push "$tag"
          done
          echo "Pushed tags:"
          echo "${{ steps.meta.outputs.tags }}"

      # ── Sign with Cosign (keyless, GitHub OIDC) ────────────────────────────
      # Keyless signing means NO long-lived keys are stored anywhere.
      # Cosign exchanges the GitHub OIDC token for a short-lived Fulcio cert,
      # records the signature in the Rekor transparency log, and attaches it
      # to the image in GHCR as an OCI artifact.
      # We ALWAYS sign by digest (not tag) so the signature is immutable.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        # Installs the cosign binary; version is pinned by the action release.

      - name: Capture image digest
        id: digest
        run: |
          # Resolve the SHA-tagged image to its content-addressable digest.
          # We use the sha- tag (immutable) produced by docker/metadata-action.
          SHA_TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep 'sha-' | head -1)
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$SHA_TAG" 2>/dev/null || \
                   docker inspect --format='{{index .RepoDigests 0}}' secure-api:slim)
          # DIGEST is of the form ghcr.io/org/repo@sha256:abc123...
          REPO=$(echo "$DIGEST" | cut -d@ -f1)
          HASH=$(echo "$DIGEST" | cut -d@ -f2)
          echo "digest=$HASH"   >> "$GITHUB_OUTPUT"
          echo "repo=$REPO"     >> "$GITHUB_OUTPUT"
          echo "Full digest ref: $DIGEST"

      - name: Sign image with Cosign (keyless)
        env:
          # Cosign reads the OIDC token automatically from the GitHub Actions
          # environment when COSIGN_EXPERIMENTAL is not needed (cosign >= 2.x).
          COSIGN_YES: "true"   # Equivalent to --yes; skips interactive prompt
        run: |
          REPO="${{ steps.digest.outputs.repo }}"
          DIGEST="${{ steps.digest.outputs.digest }}"
          echo "Signing ${REPO}@${DIGEST}"
          cosign sign "${REPO}@${DIGEST}"
          echo "✅ Signature recorded in Rekor transparency log."


  # ── 6. VERIFY SIGNATURE ────────────────────────────────────────────────────
  # Separate job so that verification happens in a clean environment with no
  # access to the build job's intermediate state. This proves the signature is
  # independently verifiable by anyone — not just the build machine.
  verify-signature:
    name: Verify Cosign image signature
    runs-on: ubuntu-latest
    needs: build          # Must run after build has signed and pushed

    permissions:
      contents: read
      packages: read       # Read the image from GHCR to verify its signature
      id-token: write      # Needed by Cosign to fetch the OIDC token for verification

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Verify that:
      #   1. A valid Cosign signature exists on the image digest.
      #   2. The signature certificate was issued by Fulcio
      #      (https://fulcio.sigstore.dev).
      #   3. The OIDC subject matches THIS workflow's ref — not any other
      #      workflow or caller.
      # If any check fails, cosign verify exits non-zero and the job fails.
      - name: Verify image signature
        env:
          REPO:   ${{ needs.build.outputs.image-repo }}
          DIGEST: ${{ needs.build.outputs.image-digest }}
        run: |
          echo "Verifying ${REPO}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            "${REPO}@${DIGEST}" \
            | jq .
          echo "✅ Signature verified. Image is authentic and unmodified."
